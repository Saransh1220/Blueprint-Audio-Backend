openapi: 3.0.3
info:
  title: Waveyard API
  version: 1.0.0
  description: |-
    HTTP API for the Waveyard beat marketplace.

    Use **Authorize** to provide an access token as `Bearer <token>` for protected operations. Refresh tokens are stored in an HTTP-only `refresh_token` cookie.
  contact:
    name: Waveyard Engineering
servers:
  - url: /
    description: Current API host
security: []
tags:
  - name: Operations
    description: Health and observability endpoints
  - name: Authentication
    description: Registration, sessions, verification, and password recovery
  - name: Catalog
    description: Public beat catalog and producer catalog operations
  - name: Uploads
    description: Durable multi-step producer upload pipeline
  - name: Users
    description: User profiles and public producer information
  - name: Payments
    description: Orders, payment verification, licenses, and downloads
  - name: Notifications
    description: User notifications and realtime subscription
  - name: Analytics
    description: Plays, favorites, and producer analytics
  - name: Admin
    description: Super-admin management and audit operations
paths:
  /admin/analytics/overview:
    get:
      tags:
        - Admin
      operationId: adminAnalyticsOverview
      summary: Admin platform analytics overview
      description: Super-admin platform-wide metrics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /admin/audit-log:
    get:
      tags:
        - Admin
      operationId: adminListAuditLog
      summary: Admin audit log
      description: Super-admin audit log of changes made by administrators
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Page size
          schema:
            type: integer
        - name: offset
          in: query
          description: Offset
          schema:
            type: integer
      responses:
        "200":
          description: OK
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /admin/licenses:
    get:
      tags:
        - Admin
      operationId: adminListLicenses
      summary: Admin list licenses
      description: Super-admin search issued licenses
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Page size
          schema:
            type: integer
        - name: offset
          in: query
          description: Offset
          schema:
            type: integer
      responses:
        "200":
          description: OK
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /admin/orders:
    get:
      tags:
        - Admin
      operationId: adminListOrders
      summary: Admin list orders
      description: Super-admin search orders across all buyers and producers
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Page size
          schema:
            type: integer
        - name: offset
          in: query
          description: Offset
          schema:
            type: integer
        - name: status
          in: query
          description: Status filter
          schema:
            type: string
      responses:
        "200":
          description: OK
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /admin/roles:
    get:
      tags:
        - Admin
      operationId: adminListRoles
      summary: Admin list roles
      description: Lists every role (business and system) with the permissions it grants
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /admin/specs:
    get:
      tags:
        - Admin
      operationId: adminListSpecs
      summary: Admin list specs
      description: Super-admin search specs including deleted items
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Page size
          schema:
            type: integer
        - name: offset
          in: query
          description: Offset
          schema:
            type: integer
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
      responses:
        "200":
          description: OK
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /admin/specs/{id}:
    delete:
      tags:
        - Admin
      operationId: adminDeleteSpec
      summary: Admin delete spec
      description: Super-admin hard or soft delete of spec
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Spec UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
        - Admin
      operationId: adminUpdateSpec
      summary: Admin update spec
      description: Super-admin override spec properties
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Spec UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateSpecRequest'
      responses:
        "200":
          description: OK
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /admin/users:
    get:
      tags:
        - Admin
      operationId: adminListUsers
      summary: Admin list users
      description: Super-admin search and list accounts with role and status filters
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Page size
          schema:
            type: integer
        - name: offset
          in: query
          description: Offset
          schema:
            type: integer
        - name: q
          in: query
          description: Search query
          schema:
            type: string
      responses:
        "200":
          description: OK
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /admin/users/{id}:
    get:
      tags:
        - Admin
      operationId: adminGetUser
      summary: Admin get user details
      description: Super-admin inspect single account with system details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /admin/users/{id}/status:
    patch:
      tags:
        - Admin
      operationId: adminUpdateUserStatus
      summary: Admin update user account status
      description: Suspends or activates user account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateStatusRequest'
      responses:
        "200":
          description: OK
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /admin/users/{id}/system-role:
    patch:
      tags:
        - Admin
      operationId: adminUpdateUserSystemRole
      summary: Admin update user system role
      description: Assigns a system-kind role from the roles table (for example super_admin or user)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateSystemRoleRequest'
      responses:
        "200":
          description: OK
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /analytics/overview:
    get:
      tags:
        - Analytics
      operationId: getProducerAnalyticsOverview
      summary: Get producer aggregate metrics overview
      description: Aggregates revenue, plays, conversion rates, and time-series charts
      security:
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          description: Lookback window in days (e.g. 7, 30, 90)
          schema:
            type: integer
        - name: sortBy
          in: query
          description: Sorting field for ranked breakdowns
          schema:
            type: string
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsOverviewResponse'
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /analytics/top-specs:
    get:
      tags:
        - Analytics
      operationId: getProducerTopSpecs
      summary: Get top performing specs for producer
      description: Ranked list of best-performing tracks
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Max items to return
          schema:
            type: integer
        - name: sortBy
          in: query
          description: Sort by plays, revenue, or favorites
          schema:
            type: string
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopSpecStat'
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /auth/forgot-password:
    post:
      tags:
        - Authentication
      operationId: forgotPassword
      summary: Request password reset
      description: Generates and emails a password reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /auth/google:
    post:
      tags:
        - Authentication
      operationId: googleLogin
      summary: Log in with Google ID token
      description: Authenticates or creates a user account via a verified Google ID token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags:
        - Authentication
      operationId: logoutUser
      summary: Log out
      description: Revokes the current refresh session and clears the refresh cookie
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      tags:
        - Authentication
      operationId: refreshToken
      summary: Refresh access token
      description: Rotates the refresh session sent via HTTP-only cookie and issues a new access token
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /auth/resend-verification:
    post:
      tags:
        - Authentication
      operationId: resendVerificationEmail
      summary: Resend verification email
      description: Sends a new email verification code if the account is unverified
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /auth/reset-password:
    post:
      tags:
        - Authentication
      operationId: resetPassword
      summary: Reset password
      description: Resets the password using the code received via email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /auth/verify-email:
    post:
      tags:
        - Authentication
      operationId: verifyEmail
      summary: Verify email address
      description: Validates a verification code received by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /catalog/home:
    get:
      tags:
        - Catalog
      operationId: getCatalogHome
      summary: Get catalog homepage data
      description: Returns curated and ranked catalog sections along with catalog-wide counts
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomepageResponse'
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /health:
    get:
      tags:
        - Operations
      operationId: healthCheck
      summary: Check API health
      description: Returns OK if the service is running
      responses:
        "200":
          description: OK
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /licenses:
    get:
      tags:
        - Payments
      operationId: getUserLicenses
      summary: List purchased licenses
      description: Returns all active beat licenses owned by the caller
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          schema:
            type: integer
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
        - name: type
          in: query
          description: Filter by license type
          schema:
            type: string
        - name: search
          in: query
          description: Search by title
          schema:
            type: string
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/License'
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /licenses/{id}/downloads:
    get:
      tags:
        - Payments
      operationId: getLicenseDownloads
      summary: Get presigned asset download links
      description: Returns temporary download URLs for stems, WAV, and MP3 files
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: License UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LicenseDownloadsResponse'
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /login:
    post:
      tags:
        - Authentication
      operationId: loginUser
      summary: Log in with email and password
      description: Authenticates the user, sets an HTTP-only refresh cookie, and returns a short-lived bearer access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /me:
    get:
      tags:
        - Authentication
      operationId: getCurrentUser
      summary: Get current user profile
      description: Returns authenticated user account details
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /me/favorites:
    get:
      tags:
        - Users
      operationId: listMyFavorites
      summary: List caller favorite specs
      description: Returns a paginated list of specs favorited by the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Number of favorites to retrieve
          schema:
            type: integer
        - name: cursor
          in: query
          description: Opaque pagination cursor
          schema:
            type: string
      responses:
        "200":
          description: OK
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /metrics:
    get:
      tags:
        - Operations
      operationId: prometheusMetrics
      summary: Prometheus metrics
      description: Exposes runtime, process, and HTTP metrics for Prometheus scraping
      responses:
        "200":
          description: OK
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /notifications:
    get:
      tags:
        - Notifications
      operationId: listNotifications
      summary: List caller notifications
      description: Fetches user notifications sorted by recent activity
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          schema:
            type: integer
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /notifications/{id}/read:
    patch:
      tags:
        - Notifications
      operationId: markNotificationRead
      summary: Mark notification as read
      description: Flags single notification as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Notification UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        "400":
          description: ""
          $ref: '#/components/responses/BadRequest'
        "401":
          description: ""
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: ""
          $ref: '#/components/responses/Forbidden'
        "500":
          description: ""
          $ref: '#/components/responses/InternalError'
  /notifications/read-all:
    patch:
      tags:
        - Notifications
